name: Release container images

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      GIT_TAG: ${{ steps.vars.outputs.GIT_TAG }}
      SHA_COMMIT: ${{ steps.vars.outputs.SHA_COMMIT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine image tags
        id: vars
        run: |
          GIT_TAG=${GITHUB_REF##*/}
          SHA_COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "GIT_TAG=$GIT_TAG" >> $GITHUB_OUTPUT
          echo "SHA_COMMIT=$SHA_COMMIT" >> $GITHUB_OUTPUT
          echo "Release: $GIT_TAG ($SHA_COMMIT)"

  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: api
            containerfile: deployments/containerfiles/Containerfile-api
          - component: agent
            containerfile: deployments/containerfiles/Containerfile-agent
          - component: scanner
            containerfile: deployments/containerfiles/Containerfile-scanner
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Quay.io
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | podman login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          podman build \
            --platform linux/amd64 \
            --build-arg VERSION=${{ needs.setup.outputs.GIT_TAG }} \
            --build-arg COMMIT=${{ needs.setup.outputs.SHA_COMMIT }} \
            -t quay.io/${{ secrets.QUAY_ORG_NAME }}/cluster-iq-${{ matrix.component }}:${{ needs.setup.outputs.GIT_TAG }} \
            -f ${{ matrix.containerfile }} .

      - name: Push version tag
        run: |
          podman push quay.io/${{ secrets.QUAY_ORG_NAME }}/cluster-iq-${{ matrix.component }}:${{ needs.setup.outputs.GIT_TAG }}

      - name: Tag and push latest
        run: |
          podman tag \
            quay.io/${{ secrets.QUAY_ORG_NAME }}/cluster-iq-${{ matrix.component }}:${{ needs.setup.outputs.GIT_TAG }} \
            quay.io/${{ secrets.QUAY_ORG_NAME }}/cluster-iq-${{ matrix.component }}:latest
          podman push quay.io/${{ secrets.QUAY_ORG_NAME }}/cluster-iq-${{ matrix.component }}:latest

      - name: Logout from Quay.io
        if: always()
        run: |
          podman logout quay.io

  verify:
    name: Verify ${{ matrix.component }}
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        include:
          - component: api
          - component: agent
          - component: scanner
    steps:
      - name: Pull and verify image
        run: |
          podman pull quay.io/${{ secrets.QUAY_ORG_NAME }}/cluster-iq-${{ matrix.component }}:${{ needs.setup.outputs.GIT_TAG }}
          podman pull quay.io/${{ secrets.QUAY_ORG_NAME }}/cluster-iq-${{ matrix.component }}:latest
